name: Gateway - Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/gateway:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 8822
          script: |
            set -e
            
            echo "🔄 Gateway 배포 시작..."
            
            # 네트워크 보장
            docker network create team3-network || true
            
            # 기존 컨테이너 정리 (이름: gateway)
            if [ "$(docker ps -aq -f name=gateway)" ]; then
                echo "🧹 기존 Gateway 컨테이너 삭제..."
                docker rm -f gateway
            fi
            
            # 이미지 Pull
            docker pull ${{ secrets.DOCKER_USERNAME }}/gateway:latest
            
            # ★ Gateway 실행
            # - 포트: 10443 (외부) -> 8080 (내부)
            # - 이름: gateway
            # - Eureka 주소: 환경변수로 강제 주입 (안전장치)
            docker run -d \
              -p 10443:8080 \
              --name gateway \
              --network team3-network \
              --restart unless-stopped \
              -e EUREKA_CLIENT_SERVICEURL_DEFAULTZONE="http://eureka:8761/eureka/" \
              ${{ secrets.DOCKER_USERNAME }}/gateway:latest
            
            echo "🚀 Gateway 실행 완료!"