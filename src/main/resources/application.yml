spring:
  application:
    name: team3-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
#          routes:
#                    - id: auth-route
#                      uri: lb://TEAM3-AUTH
#                      predicates:
#                        - Path=/auth/**

#                    - id: coupon-route
