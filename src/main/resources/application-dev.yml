spring:
  application:
    name: team3-gateway

  data:
    redis:
      host: s4.java21.net
      port: 6379
      password: "*N2vya7H@muDTwdNMR!"
      database: 370

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

      routes:
        - id: payment-route
          # Eureka 통해 라우팅 (서비스 이름 기준)
          uri: lb://team3-order-payment
          predicates:
            - Path=/api/payments/**
          filters:
            - name: AuthorizationHeaderFilter # 회원용

        - id: guest-payment-route
          uri: lb://team3-order-payment
          predicates:
            - Path=/api/guest/payments/** # 비회원용

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
      # defaultZone: http://team3-eureka:8761/eureka/

jwt:
